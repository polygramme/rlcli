[project]
name = "polygramme-rlcli"
version = "0.1.0"
description = "One-shot CLI for Tinker-API post-training on your own GPUs (SkyRL backend): serve, train, and fused RL losses like forward_backward('gspo') in a single command."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "rlcli contributors" }]
keywords = ["reinforcement-learning", "llm", "tinker", "skyrl", "post-training", "gspo"]
dependencies = [
    "click>=8.1",
    "httpx>=0.27",
    "tinker==0.25.0",
]

[project.optional-dependencies]
# Training drives tinker-cookbook recipes, pinned to a commit. PyPI forbids
# direct-URL dependencies, so the cookbook itself installs separately — the
# train commands print the exact pinned requirement if it is missing
# (COOKBOOK_REQUIREMENT in commands/train.py; keep the two pins in sync).
train = [
    # math_rl recipe (gsm8k env for `train rl`) hard-requires these at import.
    "sympy",
    "pylatexenc",
    "math-verify",
    # harbor_rl imports ModalSandbox at module level, so the modal SDK must be
    # installed even when using rlcli's local Docker sandbox (no account needed).
    "modal",
    # Token-in/token-out rollouts (rlcli/tito_bridge.py). Torch-free. Optional
    # at runtime: without it prime_renderer_for() returns None and every turn
    # re-renders, which is the pre-bridge behaviour.
    "renderers>=0.1.11",
]
dev = ["pytest>=8"]
# Polygramme Cloud proxy (cloud/pg_proxy.py) + its contract tests.
cloud = ["fastapi", "uvicorn", "httpx", "transformers", "numpy"]
# Live pulls with `rlcli import --project` (file-based langsmith import needs nothing).
langsmith = ["langsmith"]

[project.scripts]
rlcli = "rlcli.cli:main"

[project.urls]
Repository = "https://github.com/polygramme/rlcli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rlcli"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["docker: needs a local Docker daemon"]
