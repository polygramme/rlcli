[project]
name = "polygramme-rlcli"
version = "0.1.0.dev0"
description = "One-shot CLI for Tinker-API post-training on your own GPUs (SkyRL backend): serve, train, and fused RL losses like forward_backward('gspo') in a single command."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "rlcli contributors" }]
keywords = ["reinforcement-learning", "llm", "tinker", "skyrl", "post-training", "gspo"]
dependencies = [
    "click>=8.1",
    "httpx>=0.27",
    "tinker==0.25.0",
]

[project.optional-dependencies]
# Training drives tinker-cookbook recipes. Pinned to a commit — never @nightly.
train = [
    "tinker-cookbook @ git+https://github.com/thinking-machines-lab/tinker-cookbook@f46eddde86e5397138917516a6c69d2ecbf538b1",
    # math_rl recipe (gsm8k env for `train rl`) hard-requires these at import.
    "sympy",
    "pylatexenc",
    "math-verify",
    # harbor_rl imports ModalSandbox at module level, so the modal SDK must be
    # installed even when using rlcli's local Docker sandbox (no account needed).
    "modal",
]
dev = ["pytest>=8"]

[project.scripts]
rlcli = "rlcli.cli:main"

[project.urls]
Repository = "https://github.com/polygramme/rlcli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rlcli"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
